version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repositorium_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    networks:
      - search_network

  frontend:
    build:
      context: ./repositorium-frontend
      dockerfile: Dockerfile
    container_name: repositorium_frontend
    ports:
      - "3000:3000"  # ◄ Ajustado para a porta real do teu Vite
    volumes:
      - ./repositorium-frontend/src:/app/src
      - ./repositorium-frontend/index.html:/app/index.html
      - ./repositorium-frontend/vite.config.js:/app/vite.config.js
      - ./repositorium-frontend/package.json:/app/package.json
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - search_network

networks:
  search_network:
    driver: bridge
  